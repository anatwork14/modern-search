name: quality

on:
  pull_request:
  push:
    branches:
      - integration/researchos-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.22,<5'
      - name: Validate protocol schema and quality contract tests
        run: python -m unittest discover -s tests/contracts -v
      - name: Data import tests
        run: python -m unittest discover -s tests/data -v
      - name: Embedding contract tests
        run: python -m unittest discover -s tests/embeddings -v
      - name: Retrieval tests
        run: python -m unittest discover -s tests/retrieval -v
      - name: Security acceptance tests
        run: python -m unittest discover -s tests/security -v
      - name: Stdio integration tests
        run: python -m unittest discover -s tests/integration -v

  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend tests, types, and production build
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Rust compile and test gate
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

